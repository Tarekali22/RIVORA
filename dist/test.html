<style>
/* Layout concept: full-bleed 3D canvas; glass HUD hugging safe-area corners; menus as centred sun-bleached panels. */
:root {
  --ink: #0d1418; --glass: rgba(10, 18, 24, 0.62); --glass-2: rgba(16, 28, 36, 0.86); --line: rgba(255, 255, 255, 0.14);
  --text: #f4efe6; --muted: #a9b4b8; --sun: #ff7a45; --sun-2: #ffb35c; --sea: #2ec4b6; --bad: #ff4d5e; --good: #4ade80; --warn: #fbbf24;

  --fs: 1; color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: #05080a; color: var(--text); font-family: var(--ui); }
body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; }
#app { position: fixed; inset: 0; }
#view { position: absolute; inset: 0; }
#view canvas { display: block; width: 100%; height: 100%; outline: none; }
button { font-family: var(--ui); }
.hidden { display: none !important; }
/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; font-size: calc(14px * var(--fs)); }
#hud .tr { position: absolute; top: calc(12px + var(--safe-t)); right: calc(14px + var(--safe-r)); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
#money { font-family: var(--display); font-weight: 800; font-size: calc(30px * var(--fs)); letter-spacing: 0.02em; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.55), 0 0 18px rgba(0,0,0,.35); font-variant-numeric: tabular-nums; }
#money small { display: block; font-family: var(--ui); font-weight: 600; font-size: 12px; color: var(--muted); text-align: right; letter-spacing: 0.06em; }
#wanted { display: flex; gap: 3px; height: 22px; }

#mm canvas { width: 196px; height: 196px; border-radius: 50%; display: block; }
#mm .ring { position: absolute; inset: -6px; }
#loc { position: absolute; left: calc(220px + var(--safe-l)); bottom: calc(22px + var(--safe-b)); font-family: var(--display); font-weight: 800; font-size: calc(22px * var(--fs)); letter-spacing: .05em; text-transform: uppercase; text-shadow: 0 2px 6px rgba(0,0,0,.8); }

#prompt { position: absolute; left: 50%; bottom: calc(118px + var(--safe-b)); transform: translateX(-50%); display: flex; gap: 8px; align-items: center; padding: 8px 14px; border-radius: 999px; background: var(--glass-2); border: 1px solid var(--line); font-weight: 600; white-space: nowrap; }
#prompt kbd, .kbd { font-family: var(--ui); font-weight: 700; font-size: 12px; min-width: 22px; text-align: center; padding: 3px 7px; border-radius: 6px; background: var(--text); color: var(--ink); }

#subs { position: absolute; left: 50%; bottom: calc(160px + var(--safe-b)); transform: translateX(-50%); max-width: min(720px, 86vw); text-align: center; font-size: calc(18px * var(--fs)); font-weight: 600; text-shadow: 0 2px 4px #000, 0 0 12px #000; line-height: 1.35; }

#hint:empty { display: none; }
#toasts { position: absolute; right: calc(14px + var(--safe-r)); top: calc(110px + var(--safe-t)); width: min(320px, 70vw); display: flex; flex-direction: column; gap: 8px; }

#bigtext { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; text-align: center; }
#bigtext h1 { font-family: var(--display); font-weight: 900; font-size: clamp(48px, 10vw, 120px); margin: 0; letter-spacing: .04em; text-shadow: 0 6px 30px rgba(0,0,0,.6); }

/* ---------- panels / menus ---------- */
.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: calc(16px + var(--safe-t)) max(16px, var(--safe-r)) calc(16px + var(--safe-b)) max(16px, var(--safe-l)); background: rgba(5, 10, 14, 0.55); backdrop-filter: blur(4px); pointer-events: auto; z-index: 20; }
.panel { width: min(760px, 100%); max-height: 100%; overflow: auto; background: linear-gradient(180deg, rgba(20,32,40,.96), rgba(12,20,26,.97)); border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.5); -webkit-user-select: text; user-select: text; touch-action: pan-y; }
.panel h2 { font-family: var(--display); font-weight: 900; font-size: 34px; letter-spacing: .04em; margin: 0 0 4px; text-transform: uppercase; }
.panel h3 { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: .05em; margin: 18px 0 8px; text-transform: uppercase; color: var(--sun-2); }
.panel p { color: var(--muted); line-height: 1.5; margin: 6px 0; max-width: 65ch; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.btn { appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--text); font-weight: 700; font-size: 15px; padding: 11px 16px; border-radius: 12px; cursor: pointer; text-align: left; }
.btn:hover, .btn:focus-visible { background: rgba(255,255,255,.12); outline: none; border-color: rgba(255,255,255,.3); }
.btn.primary { background: var(--sun); color: #1a0d06; border-color: transparent; }
.btn.primary:hover { background: var(--sun-2); }
.btn.small { padding: 7px 11px; font-size: 13px; border-radius: 9px; }
.btn.sel { border-color: var(--sun); background: rgba(255,122,69,.16); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.04); }
.item .t { font-weight: 700; } .item .d { font-size: 13px; color: var(--muted); } .price { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--sun-2); white-space: nowrap; }
label.f { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
input[type=range] { width: 100%; accent-color: var(--sun); }
input[type=text], textarea, select { width: 100%; box-sizing: border-box; background: rgba(0,0,0,.35); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; font: 500 14px var(--ui); }
textarea { min-height: 90px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); cursor: pointer; padding: 0; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 14px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.kv span:nth-child(odd) { color: var(--muted); }
.note { font-size: 12px; color: var(--muted); }
/* ---------- title ---------- */
#title { position: absolute; inset: 0; z-index: 25; display: flex; flex-direction: column; justify-content: flex-end; padding: calc(28px + var(--safe-t)) max(22px, var(--safe-r)) calc(28px + var(--safe-b)) max(22px, var(--safe-l)); background: linear-gradient(90deg, rgba(5,8,10,.82) 0%, rgba(5,8,10,.4) 38%, rgba(5,8,10,0) 65%), linear-gradient(0deg, rgba(5,8,10,.7), rgba(5,8,10,0) 40%); pointer-events: auto; }
#title .logo { font-family: var(--display); font-weight: 900; font-size: clamp(72px, 14vw, 168px); line-height: .82; letter-spacing: .02em; margin: 0; background: linear-gradient(180deg, #fff 30%, #ffd6a8 60%, #ff7a45); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 24px rgba(0,0,0,.45)); }
#title .tag { font-family: var(--display); font-weight: 800; letter-spacing: .42em; font-size: clamp(14px, 2vw, 20px); margin: 10px 0 26px 4px; color: #ffe4c9; }
#title .menu { display: grid; gap: 8px; width: min(320px, 100%); }

#title .menu .btn.primary:hover { background: var(--sun-2); }
#title .foot { margin-top: 18px; font-size: 12px; color: var(--muted); max-width: 520px; }
#loading { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(ellipse at 50% 70%, #3b1d12 0%, #0b0f12 60%); }
#loading .logo { font-family: var(--display); font-weight: 900; font-size: 64px; letter-spacing: .06em; color: #ffe4c9; }
#loading .bar { width: min(320px, 70vw); height: 4px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; } #loading .bar i { display: block; height: 100%; width: 0; background: var(--sun); transition: width .2s; }
#loading .msg { font-size: 13px; color: var(--muted); }
/* ---------- phone ---------- */
#phone { position: absolute; right: calc(24px + var(--safe-r)); bottom: calc(20px + var(--safe-b)); width: 300px; height: min(600px, calc(100% - 40px)); border-radius: 38px; padding: 12px; background: #0b0d0f; border: 2px solid #2a2f33; box-shadow: 0 30px 70px rgba(0,0,0,.6); z-index: 22; pointer-events: auto; transform-origin: bottom right; animation: pin .2s ease-out; }

#phone .app i { width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; font-style: normal; font-size: 22px; font-weight: 900; font-family: var(--display); box-shadow: 0 4px 10px rgba(0,0,0,.25); }
#phone .app em { position: absolute; top: -4px; right: 6px; background: var(--bad); color: #fff; font-style: normal; font-size: 10px; border-radius: 9px; padding: 1px 6px; }
