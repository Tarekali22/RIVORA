<title>RIVORA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: full-bleed 3D canvas; glass HUD hugging safe-area corners; menus as centred sun-bleached panels. */
:root {
  --ink: #0d1418; --glass: rgba(10, 18, 24, 0.62); --glass-2: rgba(16, 28, 36, 0.86); --line: rgba(255, 255, 255, 0.14);
  --text: #f4efe6; --muted: #a9b4b8; --sun: #ff7a45; --sun-2: #ffb35c; --sea: #2ec4b6; --bad: #ff4d5e; --good: #4ade80; --warn: #fbbf24;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --ui: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
  --fs: 1; color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: #05080a; color: var(--text); font-family: var(--ui); }
body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; }
#app { position: fixed; inset: 0; }
#view { position: absolute; inset: 0; }
#view canvas { display: block; width: 100%; height: 100%; outline: none; }
button { font-family: var(--ui); }
.hidden { display: none !important; }
/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; font-size: calc(14px * var(--fs)); }
#hud .tr { position: absolute; top: calc(12px + var(--safe-t)); right: calc(14px + var(--safe-r)); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
#money { font-family: var(--display); font-weight: 800; font-size: calc(30px * var(--fs)); letter-spacing: 0.02em; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.55), 0 0 18px rgba(0,0,0,.35); font-variant-numeric: tabular-nums; }
#money small { display: block; font-family: var(--ui); font-weight: 600; font-size: 12px; color: var(--muted); text-align: right; letter-spacing: 0.06em; }
#wanted { display: flex; gap: 3px; height: 22px; }
#wanted i { width: 20px; height: 20px; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); background: rgba(255,255,255,.18); }
#wanted i.on { background: #fff; filter: drop-shadow(0 0 4px rgba(255,255,255,.7)); }
#wanted.search i.on { animation: blink 0.6s steps(2) infinite; }
@keyframes blink { 50% { opacity: .25 } }
#clock { font-weight: 600; font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; text-shadow: 0 1px 2px #000; }
#objective { position: absolute; top: calc(14px + var(--safe-t)); left: 50%; transform: translateX(-50%); max-width: min(560px, 70vw); text-align: center; font-weight: 600; font-size: calc(15px * var(--fs)); padding: 8px 16px; border-radius: 10px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(6px); }
#objective b { color: var(--sun-2); font-family: var(--display); letter-spacing: .06em; font-size: 1.05em; margin-right: 6px; }
#objective:empty { display: none; }
#mm { position: absolute; left: calc(14px + var(--safe-l)); bottom: calc(14px + var(--safe-b)); width: 196px; height: 196px; }
#mm canvas { width: 196px; height: 196px; border-radius: 50%; display: block; }
#mm .ring { position: absolute; inset: -6px; }
#loc { position: absolute; left: calc(220px + var(--safe-l)); bottom: calc(22px + var(--safe-b)); font-family: var(--display); font-weight: 800; font-size: calc(22px * var(--fs)); letter-spacing: .05em; text-transform: uppercase; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
#loc small { display: block; font-family: var(--ui); font-weight: 600; font-size: 12px; letter-spacing: .08em; color: var(--muted); }
#prompt { position: absolute; left: 50%; bottom: calc(118px + var(--safe-b)); transform: translateX(-50%); display: flex; gap: 8px; align-items: center; padding: 8px 14px; border-radius: 999px; background: var(--glass-2); border: 1px solid var(--line); font-weight: 600; white-space: nowrap; }
#prompt kbd, .kbd { font-family: var(--ui); font-weight: 700; font-size: 12px; min-width: 22px; text-align: center; padding: 3px 7px; border-radius: 6px; background: var(--text); color: var(--ink); }
#prompt:empty { display: none; }
#subs { position: absolute; left: 50%; bottom: calc(160px + var(--safe-b)); transform: translateX(-50%); max-width: min(720px, 86vw); text-align: center; font-size: calc(18px * var(--fs)); font-weight: 600; text-shadow: 0 2px 4px #000, 0 0 12px #000; line-height: 1.35; }
#subs b { color: var(--sun-2); }
#hint { position: absolute; left: 50%; top: calc(64px + var(--safe-t)); transform: translateX(-50%); font-weight: 600; font-size: 14px; padding: 6px 12px; border-radius: 8px; background: rgba(0,0,0,.45); text-shadow: 0 1px 2px #000; }
#hint:empty { display: none; }
#toasts { position: absolute; right: calc(14px + var(--safe-r)); top: calc(110px + var(--safe-t)); width: min(320px, 70vw); display: flex; flex-direction: column; gap: 8px; }
.toast { padding: 10px 12px 10px 14px; border-radius: 12px; background: var(--glass-2); border: 1px solid var(--line); border-left: 4px solid var(--sea); animation: tin .25s ease-out; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.toast b { display: block; font-size: 14px; } .toast span { font-size: 13px; color: var(--muted); }
.toast.bad { border-left-color: var(--bad); } .toast.good { border-left-color: var(--good); } .toast.warn { border-left-color: var(--warn); } .toast.mission { border-left-color: var(--sun); }
@keyframes tin { from { transform: translateX(30px); opacity: 0 } }
#veh { position: absolute; right: calc(16px + var(--safe-r)); bottom: calc(16px + var(--safe-b)); text-align: right; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
#veh .spd { font-family: var(--display); font-weight: 900; font-size: calc(54px * var(--fs)); line-height: .9; font-variant-numeric: tabular-nums; }
#veh .unit { font-size: 12px; color: var(--muted); letter-spacing: .1em; font-weight: 700; }
#veh .bars { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
#veh .bar { width: 90px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; margin-top: 3px; } #veh .bar i { display: block; height: 100%; background: var(--sea); }
#vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 160px 40px rgba(170, 0, 0, 0); transition: box-shadow .15s; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .4s; }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .45s; }
#bigtext { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; text-align: center; }
#bigtext h1 { font-family: var(--display); font-weight: 900; font-size: clamp(48px, 10vw, 120px); margin: 0; letter-spacing: .04em; text-shadow: 0 6px 30px rgba(0,0,0,.6); }
#bigtext p { margin: 6px 0 0; font-weight: 600; font-size: 18px; color: var(--text); text-shadow: 0 2px 6px #000; }
/* ---------- panels / menus ---------- */
.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: calc(16px + var(--safe-t)) max(16px, var(--safe-r)) calc(16px + var(--safe-b)) max(16px, var(--safe-l)); background: radial-gradient(ellipse at center, rgba(5,10,14,.18), rgba(5,10,14,.42)); pointer-events: auto; z-index: 20; }
.panel { width: min(760px, 100%); max-height: 100%; overflow: auto; background: linear-gradient(180deg, rgba(18,30,38,.80), rgba(10,18,24,.84)); -webkit-backdrop-filter: blur(10px) saturate(1.1); backdrop-filter: blur(10px) saturate(1.1); position: relative; border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.5); -webkit-user-select: text; user-select: text; touch-action: pan-y; }
.panel h2 { font-family: var(--display); font-weight: 900; font-size: 34px; letter-spacing: .04em; margin: 0 0 4px; text-transform: uppercase; }
.panel h3 { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: .05em; margin: 18px 0 8px; text-transform: uppercase; color: var(--sun-2); }
.panel p { color: var(--muted); line-height: 1.5; margin: 6px 0; max-width: 65ch; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.btn { appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--text); font-weight: 700; font-size: 15px; padding: 11px 16px; border-radius: 12px; cursor: pointer; text-align: left; }
.btn:hover, .btn:focus-visible { background: rgba(255,255,255,.12); outline: none; border-color: rgba(255,255,255,.3); }
.btn.primary { background: var(--sun); color: #1a0d06; border-color: transparent; }
.btn.primary:hover { background: var(--sun-2); }
.btn.small { padding: 7px 11px; font-size: 13px; border-radius: 9px; }
.btn.sel { border-color: var(--sun); background: rgba(255,122,69,.16); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.04); }
.item .t { font-weight: 700; } .item .d { font-size: 13px; color: var(--muted); } .price { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--sun-2); white-space: nowrap; }
label.f { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
input[type=range] { width: 100%; accent-color: var(--sun); }
input[type=text], textarea, select { width: 100%; box-sizing: border-box; background: rgba(0,0,0,.35); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; font: 500 14px var(--ui); }
textarea { min-height: 90px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); cursor: pointer; padding: 0; }
.sw.sel { border-color: #fff; box-shadow: 0 0 0 2px var(--sun); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 14px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.kv span:nth-child(odd) { color: var(--muted); }
.note { font-size: 12px; color: var(--muted); }
/* ---------- title ---------- */
#title { position: absolute; inset: 0; z-index: 25; display: flex; flex-direction: column; justify-content: flex-end; padding: calc(28px + var(--safe-t)) max(22px, var(--safe-r)) calc(28px + var(--safe-b)) max(22px, var(--safe-l)); background: linear-gradient(90deg, rgba(5,8,10,.82) 0%, rgba(5,8,10,.4) 38%, rgba(5,8,10,0) 65%), linear-gradient(0deg, rgba(5,8,10,.7), rgba(5,8,10,0) 40%); pointer-events: auto; }
#title .logo { font-family: var(--display); font-weight: 900; font-size: clamp(72px, 14vw, 168px); line-height: .82; letter-spacing: .02em; margin: 0; background: linear-gradient(180deg, #fff 30%, #ffd6a8 60%, #ff7a45); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 24px rgba(0,0,0,.45)); }
#title .tag { font-family: var(--display); font-weight: 800; letter-spacing: .42em; font-size: clamp(14px, 2vw, 20px); margin: 10px 0 26px 4px; color: #ffe4c9; }
#title .menu { display: grid; gap: 8px; width: min(320px, 100%); }
#title .menu .btn { font-size: 17px; padding: 13px 18px; background: rgba(10,18,24,.55); backdrop-filter: blur(6px); }
#title .menu .btn.primary { background: var(--sun); color: #1a0d06; }
#title .menu .btn.primary:hover { background: var(--sun-2); }
#title .foot { margin-top: 18px; font-size: 12px; color: var(--muted); max-width: 520px; }
#loading { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(ellipse at 50% 70%, #3b1d12 0%, #0b0f12 60%); }
#loading .logo { font-family: var(--display); font-weight: 900; font-size: 64px; letter-spacing: .06em; color: #ffe4c9; }
#loading .bar { width: min(320px, 70vw); height: 4px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; } #loading .bar i { display: block; height: 100%; width: 0; background: var(--sun); transition: width .2s; }
#loading .msg { font-size: 13px; color: var(--muted); }
/* ---------- phone ---------- */
#phone { position: absolute; right: calc(24px + var(--safe-r)); bottom: calc(20px + var(--safe-b)); width: 300px; height: min(600px, calc(100% - 40px)); border-radius: 38px; padding: 12px; background: #0b0d0f; border: 2px solid #2a2f33; box-shadow: 0 30px 70px rgba(0,0,0,.6); z-index: 22; pointer-events: auto; transform-origin: bottom right; animation: pin .2s ease-out; }
@keyframes pin { from { transform: translateY(40px) scale(.96); opacity: 0 } }
#phone .scr { position: relative; width: 100%; height: 100%; border-radius: 28px; overflow: hidden; background: linear-gradient(160deg, #ff9a5a 0%, #e8566e 45%, #3a2a6b 100%); display: flex; flex-direction: column; -webkit-user-select: text; user-select: text; }
#phone .sb { display: flex; justify-content: space-between; padding: 10px 18px 4px; font-size: 12px; font-weight: 700; }
#phone .body { flex: 1; overflow: auto; padding: 8px 12px 14px; touch-action: pan-y; }
#phone .apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 6px; padding: 12px 4px; }
#phone .app { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; background: none; border: 0; color: #fff; cursor: pointer; position: relative; }
#phone .app i { width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; font-style: normal; font-size: 22px; font-weight: 900; font-family: var(--display); box-shadow: 0 4px 10px rgba(0,0,0,.25); }
#phone .app em { position: absolute; top: -4px; right: 6px; background: var(--bad); color: #fff; font-style: normal; font-size: 10px; border-radius: 9px; padding: 1px 6px; }
#phone .page { background: rgba(255,255,255,.96); color: #15191c; border-radius: 18px; padding: 12px; min-height: 100%; box-sizing: border-box; }
#phone .page h4 { margin: 0 0 8px; font-size: 18px; font-family: var(--display); letter-spacing: .04em; text-transform: uppercase; }
#phone .page .li { padding: 9px 4px; border-bottom: 1px solid #e3e6e8; font-size: 13px; }
#phone .page .li b { display: block; font-size: 14px; } #phone .page .li small { color: #5e676d; }
#phone .page .pbtn { appearance: none; border: 0; background: #15191c; color: #fff; border-radius: 10px; padding: 8px 12px; font-weight: 700; margin: 4px 4px 0 0; cursor: pointer; font-size: 13px; }
#phone .page .pbtn.alt { background: #e8ebed; color: #15191c; }
#phone .back { appearance: none; background: none; border: 0; color: #15191c; font-weight: 700; padding: 0 0 8px; cursor: pointer; }
#phone .msg { padding: 8px 10px; border-radius: 14px; margin: 6px 0; background: #eef0f2; font-size: 13px; line-height: 1.4; }
#phone .msg.me { background: #15191c; color: #fff; margin-left: 30px; }
#phone .call { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: linear-gradient(180deg, #1d2d38, #0b1117); color: #fff; text-align: center; padding: 20px; }
#phone .avatar { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font: 900 30px var(--display); }
#phone .callbtns { display: flex; gap: 28px; margin-top: 24px; }
#phone .callbtns button { width: 62px; height: 62px; border-radius: 50%; border: 0; font-weight: 800; color: #fff; cursor: pointer; }
.target-photo { width: 100%; border-radius: 12px; display: block; margin: 6px 0; background: #222; }
/* ---------- map ---------- */
#map { position: absolute; inset: 0; z-index: 21; background: rgba(6,12,16,.92); pointer-events: auto; display: flex; flex-direction: column; }
#map canvas { flex: 1; width: 100%; min-height: 0; touch-action: none; cursor: crosshair; }
#map .mbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: calc(10px + var(--safe-t)) max(16px, var(--safe-r)) 10px max(16px, var(--safe-l)); flex-wrap: wrap; }
#map .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); padding: 8px max(16px, var(--safe-l)) calc(10px + var(--safe-b)); }
#map .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; background: var(--c); vertical-align: middle; }
/* ---------- touch ---------- */
#touch { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
#touch .zone { position: absolute; top: 0; bottom: 0; pointer-events: auto; }
#touch .lz { left: 0; width: 42%; } #touch .rz { right: 0; width: 58%; }
#stick { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: rgba(0,0,0,.18); display: none; pointer-events: none; }
#stick i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,255,255,.55); }
#tbtns { position: absolute; right: calc(16px + var(--safe-r)); bottom: calc(16px + var(--safe-b)); display: grid; grid-template-columns: repeat(3, 62px); gap: 10px; pointer-events: none; }
#tbtns button, #ttop button { pointer-events: auto; width: 62px; height: 62px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: rgba(10,18,24,.55); color: #fff; font: 800 12px var(--ui); letter-spacing: .02em; touch-action: none; }
#tbtns button.on { background: rgba(255,122,69,.6); }
#ttop { position: absolute; top: calc(70px + var(--safe-t)); right: calc(12px + var(--safe-r)); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
#ttop button { width: 48px; height: 48px; font-size: 11px; }
body.touch #mm { width: 132px; height: 132px; } body.touch #mm canvas { width: 132px; height: 132px; }
body.touch #loc { left: calc(156px + var(--safe-l)); font-size: 16px; bottom: calc(14px + var(--safe-b)); }
body.touch #veh { bottom: calc(14px + var(--safe-b)); right: calc(236px + var(--safe-r)); }
body.touch #toasts { top: calc(64px + var(--safe-t)); left: calc(12px + var(--safe-l)); right: auto; width: min(220px, 26vw); }
body.touch .toast span { font-size: 12px; }
body.touch #objective { max-width: 46vw; font-size: 13px; }
body.touch #ttop { flex-direction: row; top: calc(8px + var(--safe-t)); left: calc(12px + var(--safe-l)); right: auto; }
body.touch #hud .tr { gap: 2px; }
body.touch #money { font-size: 22px; }
body.touch #prompt { bottom: calc(150px + var(--safe-b)); }
@media (max-width: 720px) { #money { font-size: 22px; } #loc { display: none; } .panel { padding: 16px; } .panel h2 { font-size: 26px; } #phone { right: 50%; transform: translateX(50%); width: min(300px, 92vw); } }
@media (max-height: 460px) { #phone { height: calc(100% - 24px); bottom: 12px; } #mm, #mm canvas { width: 110px !important; height: 110px !important; } }
@media (prefers-reduced-motion: reduce) { .toast, #phone { animation: none; } }
body.touch * { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
#rotate { position: absolute; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; background: #0b0f12; font-weight: 600; }
@media (orientation: portrait) and (pointer: coarse) { body.playing #rotate { display: flex; } }
#err { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 99; padding: 12px; border-radius: 12px; background: #3a0d12; color: #ffd7dc; font: 12px ui-monospace, monospace; white-space: pre-wrap; display: none; -webkit-user-select: text; user-select: text; }

/* menus keep the world visible: one translucent panel at a time, close button, title menu hidden while a panel is open */
.panel .xclose { position: absolute; top: 10px; inset-inline-end: 10px; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: #fff; font-size: 16px; cursor: pointer; z-index: 2; }
.panel .xclose:hover { background: rgba(255,255,255,.16); }
body.panel-open #title { opacity: 0; pointer-events: none; transition: opacity .15s; }
body.panel-open #title { background: none !important; }
body.touch .panel { background: linear-gradient(180deg, rgba(18,30,38,.9), rgba(10,18,24,.92)); }

/* Arabic: right-to-left layout, Arabic font, no letter-spacing (it breaks joined letters) */
body.rtl { --display: "Cairo", "Big Shoulders Display", "Segoe UI", Tahoma, sans-serif; --ui: "Cairo", "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif; }
body.rtl, body.rtl * { letter-spacing: 0 !important; }
body.rtl .panel h2, body.rtl .panel h3, body.rtl #objective b, body.rtl .btn { text-transform: none; }
body.rtl #title .logo { font-family: "Big Shoulders Display", "Arial Narrow", sans-serif; }
body.rtl #money small { text-align: left; }
body.rtl .panel p { max-width: none; }
body.rtl #objective b { margin-right: 0; margin-left: 6px; }

/* conversation panel: docked at the bottom so the street and the person stay visible */
.dlg-ov { align-items: flex-end !important; background: linear-gradient(0deg, rgba(5,10,14,.45), rgba(5,10,14,0) 45%) !important; }
.dlg-ov .panel { width: min(780px, 97vw); margin-bottom: calc(8px + var(--safe-b)); padding: 16px 18px; }
.dlg-head { font-size: 15px; color: var(--muted); margin-inline-end: 40px; } .dlg-head b { color: var(--sun-2); font-size: 18px; font-family: var(--display); }
.dlg-line { font-size: calc(20px * var(--fs)); font-weight: 600; line-height: 1.45; margin: 8px 0 2px; min-height: 1.4em; }
.dlg-tr { color: var(--muted); font-size: 14px; min-height: 1.1em; margin-bottom: 8px; }
.dlg-opts { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; } .dlg-opts .btn.sel { outline: 2px solid var(--sun-2); }
.dlg-in { display: flex; gap: 6px; align-items: center; } .dlg-in input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.35); color: #fff; font: inherit; user-select: text; -webkit-user-select: text; }
.dlg-mic.rec { background: #d62839 !important; color: #fff; animation: micpulse 1s infinite; }
@keyframes micpulse { 50% { box-shadow: 0 0 0 6px rgba(214,40,57,.35); } }
.dlg-note { color: var(--muted); font-size: 12px; margin-top: 8px; }

/* weapons HUD */
#weaponHud { position: absolute; right: calc(18px + var(--safe-r)); bottom: calc(150px + var(--safe-b)); text-align: right; font-family: var(--display); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.6); pointer-events: none; }
#weaponHud .wa { direction: ltr; unicode-bidi: isolate; } #weaponHud .wn { font-weight: 800; font-size: 18px; letter-spacing: .04em; } #weaponHud .wa { font-weight: 900; font-size: 28px; }
#weaponHud .ar { width: 120px; height: 6px; background: rgba(255,255,255,.18); border-radius: 4px; margin-top: 6px; margin-inline-start: auto; overflow: hidden; } #weaponHud .ar i { display: block; height: 100%; background: #4cc9f0; }
#crosshair { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none; border-radius: 50%; border: 2px solid rgba(255,255,255,.75); box-shadow: 0 0 0 1px rgba(0,0,0,.4); transition: transform .12s; }
#crosshair::after { content: ''; position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px; background: #fff; border-radius: 50%; }
#crosshair.aim { transform: scale(.6); border-color: #ffd166; }
body.rtl #weaponHud { text-align: left; right: auto; left: calc(18px + var(--safe-l)); bottom: calc(200px + var(--safe-b)); }
.wbtn { position: absolute; z-index: 6; width: 54px; height: 54px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); background: rgba(10,18,24,.5); color: #fff; font-size: 20px; font-weight: 800; }
/* weapon buttons in a column just left of the touch grid (grid spans right 16-222 px), one per grid row */
.w-aim { right: calc(234px + var(--safe-r)); bottom: calc(92px + var(--safe-b)); } .w-sw { right: calc(234px + var(--safe-r)); bottom: calc(164px + var(--safe-b)); } .w-rl { right: calc(234px + var(--safe-r)); bottom: calc(20px + var(--safe-b)); }
body.touch:not(.rtl) #weaponHud { right: calc(234px + var(--safe-r)); bottom: calc(230px + var(--safe-b)); }

.msum { position: absolute; top: calc(90px + var(--safe-t)); inset-inline-end: calc(18px + var(--safe-r)); width: min(320px, 80vw); background: rgba(10,18,24,.78); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; color: #fff; z-index: 8; transition: opacity .5s, transform .5s; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.msum.out { opacity: 0; transform: translateY(-10px); } .ms-h { font-family: var(--display); font-weight: 900; font-size: 22px; color: #ffd166; } .ms-t { color: var(--muted); margin: 2px 0 6px; } .ms-m { font-size: 20px; } .ms-r { font-weight: 800; margin: 4px 0; } .ms-o { margin: 6px 0 0; padding-inline-start: 18px; font-size: 14px; } .ms-o .ok { color: #7bf1a8; } .ms-o .no { color: #ff8b94; }

#photoUI { position: absolute; inset: 0; pointer-events: none; z-index: 30; }
#photoUI .ph-top { position: absolute; top: calc(14px + var(--safe-t)); left: 50%; transform: translateX(-50%); font-family: var(--display); font-weight: 800; font-size: 20px; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
#photoUI .ph-help { position: absolute; top: calc(44px + var(--safe-t)); left: 50%; transform: translateX(-50%); color: rgba(255,255,255,.85); font-size: 13px; text-align: center; width: min(760px, 94vw); text-shadow: 0 1px 4px rgba(0,0,0,.7); }
#photoUI .ph-bar { position: absolute; bottom: calc(18px + var(--safe-b)); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap; justify-content: center; }
#photoUI .ph-bar .btn { background: rgba(10,18,24,.6); } #photoUI .ph-bar .btn.primary { background: var(--sun); color: #1a0d06; }
#photoUI::before { content: ''; position: absolute; inset: 7%; border: 1px solid rgba(255,255,255,.25); pointer-events: none; }
.w-photo { right: calc(170px + var(--safe-r)); top: calc(70px + var(--safe-t)); width: 46px; height: 46px; font-size: 18px; }

#phone .qr { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; } #phone .ptext { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.3); color: #fff; font: inherit; user-select: text; -webkit-user-select: text; }
